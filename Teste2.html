<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <!-- SDK oficial do Custom Widget TagoIO -->
  <script src="https://admin.tago.io/dist/custom-widget.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      text-align: center;
      min-width: 220px;
    }

    .row {
      font-size: 14px;
      color: #9cff9c;
      margin-bottom: 4px;
    }

    .result {
      font-size: 34px;
      font-weight: bold;
      margin-top: 8px;
      color: #4fc3f7;
    }

    .status {
      font-size: 12px;
      margin-top: 6px;
      color: #ffb300;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="row">vi: <span id="vi">--</span></div>
    <div class="row">vr: <span id="vr">--</span></div>

    <div class="result" id="res">--</div>
    <div class="status" id="status">Aguardando vi e vr</div>
  </div>

  <script>
    let vi = null;
    let vr = null;

    function num(v) {
      const n = Number(v);
      return isNaN(n) ? null : n;
    }

    function update() {
      document.getElementById("vi").innerText = vi !== null ? vi.toFixed(2) : "--";
      document.getElementById("vr").innerText = vr !== null ? vr.toFixed(2) : "--";

      if (vi !== null && vr !== null) {
        const r = vi * vr;
        document.getElementById("res").innerText = r.toFixed(2);
        document.getElementById("status").innerText = "cálculo automático (vi × vr)";
      }
    }

    // 🔹 TEMPO REAL (FONTE PRINCIPAL)
    window.TagoIO.onRealtime(buckets => {
      buckets.forEach(bucket => {
        if (!bucket.result) return;

        bucket.result.forEach(d => {
          if (d.variable === "vi") vi = num(d.value);
          if (d.variable === "vr") vr = num(d.value);
        });
      });

      update();
    });

    // 🔹 FALLBACK (caso venha algo no start)
    window.TagoIO.onStart(widget => {
      if (!widget.data) return;

      widget.data.forEach(d => {
        if (d.variable === "vi") vi = num(d.value);
        if (d.variable === "vr") vr = num(d.value);
      });

      update();
    });

    window.TagoIO.ready();
  </script>
</body>
</html>
