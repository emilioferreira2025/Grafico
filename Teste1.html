<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <!-- SDK oficial do Custom Widget TagoIO -->
  <script src="https://admin.tago.io/dist/custom-widget.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000000;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      text-align: center;
      min-width: 220px;
    }

    .label {
      font-size: 14px;
      color: #bbbbbb;
      margin-top: 6px;
    }

    .value {
      font-size: 22px;
      font-weight: bold;
      color: #00e676;
    }

    .result {
      font-size: 36px;
      font-weight: bold;
      margin-top: 12px;
      color: #4fc3f7;
    }

    .status {
      font-size: 12px;
      margin-top: 8px;
      color: #ffb300;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="label">vi</div>
    <div class="value" id="vi">--</div>

    <div class="label">vr</div>
    <div class="value" id="vr">--</div>

    <div class="result" id="result">--</div>
    <div class="status" id="status">aguardando dados</div>
  </div>

  <script>
    let vi = null;
    let vr = null;

    function toNumber(v) {
      const n = Number(v);
      return isNaN(n) ? null : n;
    }

    function render() {
      document.getElementById("vi").innerText =
        vi !== null ? vi.toFixed(2) : "--";

      document.getElementById("vr").innerText =
        vr !== null ? vr.toFixed(2) : "--";

      if (vi !== null && vr !== null) {
        const result = vi * vr;
        document.getElementById("result").innerText = result.toFixed(2);
        document.getElementById("status").innerText = "cálculo automático (vi × vr)";
      } else {
        document.getElementById("result").innerText = "--";
        document.getElementById("status").innerText = "aguardando vi e vr";
      }
    }

    // ============================
    // CARGA INICIAL
    // ============================
    window.TagoIO.onStart(widget => {
      widget.data.forEach(d => {
        if (d.variable === "vi") vi = toNumber(d.value);
        if (d.variable === "vr") vr = toNumber(d.value);
      });
      render();
    });

    // ============================
    // TEMPO REAL (CORRETO)
    // ============================
    window.TagoIO.onRealtime(buckets => {
      buckets.forEach(bucket => {
        if (!bucket.result) return;

        bucket.result.forEach(d => {
          if (d.variable === "vi") vi = toNumber(d.value);
          if (d.variable === "vr") vr = toNumber(d.value);
        });
      });

      render();
    });

    window.TagoIO.ready();
  </script>
</body>
</html>
