<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <!-- SDK oficial do Custom Widget TagoIO -->
  <script src="https://admin.tago.io/dist/custom-widget.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000000;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      text-align: center;
      min-width: 240px;
    }

    .row {
      font-size: 14px;
      color: #9cff9c;
      margin-bottom: 4px;
    }

    .result {
      font-size: 36px;
      font-weight: bold;
      margin-top: 8px;
      color: #4fc3f7;
    }

    .status {
      font-size: 12px;
      margin-top: 6px;
      color: #ffb300;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="row">current_ipp1: <span id="ipp1">--</span></div>
    <div class="row">current_ipp2: <span id="ipp2">--</span></div>

    <div class="result" id="res">--</div>
    <div class="status" id="status">Aguardando dados…</div>
  </div>

  <script>
    let current_ipp1 = null;
    let current_ipp2 = null;

    function toNumber(v) {
      const n = Number(v);
      return isNaN(n) ? null : n;
    }

    function updateUI() {
      document.getElementById("ipp1").innerText =
        current_ipp1 !== null ? current_ipp1.toFixed(2) : "--";

      document.getElementById("ipp2").innerText =
        current_ipp2 !== null ? current_ipp2.toFixed(2) : "--";

      if (current_ipp1 !== null && current_ipp2 !== null) {
        const soma = current_ipp1 + current_ipp2;
        document.getElementById("res").innerText = soma.toFixed(2);
        document.getElementById("status").innerText =
          "cálculo automático (current_ipp1 + current_ipp2)";
      } else {
        document.getElementById("res").innerText = "--";
        document.getElementById("status").innerText =
          "Aguardando current_ipp1 e current_ipp2";
      }
    }

    // ✅ FUNÇÃO CORRETA PARA "Data from"
    window.TagoIO.onData(data => {
      data.forEach(d => {
        if (d.variable === "current_ipp1") {
          current_ipp1 = toNumber(d.value);
        }
        if (d.variable === "current_ipp2") {
          current_ipp2 = toNumber(d.value);
        }
      });

      updateUI();
    });

    window.TagoIO.ready();
  </script>
</body>
</html>
