<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <!-- SDK oficial do Custom Widget TagoIO -->
  <script src="https://admin.tago.io/dist/custom-widget.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000000;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      text-align: center;
      min-width: 200px;
    }

    .row {
      font-size: 14px;
      color: #bbbbbb;
      margin-bottom: 4px;
    }

    .value {
      font-size: 22px;
      font-weight: bold;
      color: #00e676;
    }

    .result {
      font-size: 36px;
      font-weight: bold;
      margin-top: 10px;
      color: #4fc3f7;
    }

    .status {
      font-size: 12px;
      margin-top: 8px;
      color: #ffb300;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="row">Vi: <span id="vi">--</span></div>
    <div class="row">Vr: <span id="vr">--</span></div>

    <div class="result" id="result">--</div>

    <div class="status" id="status">Aguardando dados…</div>
  </div>

  <script>
    let Vi = null;
    let Vr = null;

    function safeNumber(v) {
      const n = Number(v);
      return isNaN(n) ? null : n;
    }

    function updateUI() {
      document.getElementById("vi").innerText = Vi !== null ? Vi.toFixed(2) : "--";
      document.getElementById("vr").innerText = Vr !== null ? Vr.toFixed(2) : "--";

      if (Vi !== null && Vr !== null) {
        const Vresultado = Vi * Vr;
        document.getElementById("result").innerText = Vresultado.toFixed(2);
        document.getElementById("status").innerText = "Cálculo OK (Vi × Vr)";
      } else {
        document.getElementById("result").innerText = "--";
        document.getElementById("status").innerText = "Aguardando Vi e Vr";
      }
    }

    // ===============================
    // SDK TAGOIO – CARGA INICIAL
    // ===============================
    window.TagoIO.onStart(widget => {
      widget.data.forEach(d => {
        if (d.variable === "Vi") Vi = safeNumber(d.value);
        if (d.variable === "Vr") Vr = safeNumber(d.value);
      });
      updateUI();
    });

    // ===============================
    // SDK TAGOIO – TEMPO REAL
    // ===============================
    window.TagoIO.onRealtime(buckets => {
      buckets.forEach(bucket => {
        if (!bucket.result) return;

        bucket.result.forEach(d => {
          if (d.variable === "Vi") Vi = safeNumber(d.value);
          if (d.variable === "Vr") Vr = safeNumber(d.value);
        });
      });
      updateUI();
    });

    window.TagoIO.ready();
  </script>
</body>
</html>
